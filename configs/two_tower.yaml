# Two-tower model: user tower (ID + demographics) and item tower (ID + genres),
# trained with in-batch negatives, softmax loss and logQ popularity correction.
model: two_tower
seed: 42
params:
  id_dim: 64
  feature_dim: 16
  hidden_dims: [128]
  output_dim: 64
  dropout: 0.1
  temperature: 0.05     # 0.1 was worse on validation
  logq_correction: true # without it valid NDCG@10 drops to 0.016
  use_features: true
train:
  epochs: 50
  batch_size: 1024      # = 1023 in-batch negatives per positive
  lr: 3.0e-3            # tuned on validation (1e-3: 0.0338, 3e-3: 0.0400 NDCG@10)
  weight_decay: 0.0
  eval_every: 1
  patience: 8           # validation is noisy; 5 stopped too early
  monitor: NDCG@10
  eval_batch_size: 1024
